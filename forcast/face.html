<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iigame face</title>
    <style>
        body{
          background-image: url("face_back.png");
          background-repeat: no-repeat;
padding: 0;
margin: 0;
        }
        div{
padding: 0;
margin: 0;
width: 0px;
height:0px;
overflow: visible;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  overflow-scrolling: touch;
        }
div::-webkit-scrollbar {
  display: none;
}
        img{
position: absolute;
        }
    </style>
</head>
<body>
    <div id="srollBox">
        <p id="uag"></p>
        <img id="flb" src="face_brow.svg" />
        <img id="fle" src="face_eye.svg" />
        <img id="frb" src="face_brow.svg" />
        <img id="fre" src="face_eye.svg" />
        <img id="mou" src="face_mouth.svg" />
    </div>
    
</body>
    <script>


// ----- x18 y43 -----

var volgein=4.0;
var peakmin=0.20;
var peakup=100.0;
var peakdown=1000.0;
var retioplus=0.1;

var faceswingxmin=10.0;
var faceswingymin=10.0;
var faceswingxmax=10.0;
var faceswingymax=10.0;
var eyeclosemin=100.0;
var eyeclosemax=100.0;
var eyeopenmin=3000.0;
var eyeopenmax=6000.0;



const scrollBox = document.getElementById("srollBox");
const scrollBar = scrollBox.offsetWidth - scrollBox.clientWidth;
srollBox.style.width = `calc(100% + ${scrollBar}px)`;

        var idflb = document.getElementById("flb");
        var idfle = document.getElementById("fle");
        var idfrb = document.getElementById("frb");
        var idfre = document.getElementById("fre");
        var idmou = document.getElementById("mou");

var nowtime=Date.now();
var deltime=0;
var nowvol=0.0;
var nowpeak=0.0;
var facex=0.0;
var facey=0.0;




function render(micval) {

    var retio=retioplus+micval;

  idflb.style.left= (facex+29+5*retio)+"px";
  idflb.style.top= (facey+41.5-10*retio)+"px";
  idfle.style.left= (facex+59)+"px";
  idfle.style.top= (facey+101.5-5*retio)+"px";
  idfrb.style.left= (facex+159-5*retio)+"px";
  idfrb.style.top= (facey+41.5-10*retio)+"px";
  idfre.style.left= (facex+179)+"px";
  idfre.style.top= (facey+101.5-5*retio)+"px";

  idflb.style.width= 96+"px";
  idflb.style.height= 46+"px";
  idfle.style.width= 46+"px";
  idfle.style.height= 106+"px";
  idfrb.style.width= 96+"px";
  idfrb.style.height= 46+"px";
  idfre.style.width= 46+"px";
  idfre.style.height= 106+"px";

  idmou.style.left= (102+10*retio-18) + "px";
  idmou.style.top= (305-16*retio-43) + "px";
  idmou.style.width= (116-20*retio) + "px";
  idmou.style.height= 55*retio + "px";

}

function repProcess() {
  deltime=Date.now()-nowtime;
  nowtime=Date.now();

  
if(nowpeak<nowvol) {
  nowpeak+=deltime/peakup;
  if(nowpeak>nowvol) nowpeak=nowvol;
  if(nowpeak>1.0) nowpeak=1.0;
}
else 
{
  nowpeak-=deltime/peakdown;
  if(nowpeak<nowvol) nowpeak=nowvol;
  if(nowpeak<peakmin) nowpeak=peakmin;
}


        //var uag = document.getElementById("uag");
        //uag.innerText=nowpeak;
  render(nowpeak);
}




async function start() {

const constraints = {audio: true};
const mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
const options = { sampleRate: 44100 };
const audioContext = new AudioContext(options);
const source = audioContext.createMediaStreamSource(mediaStream);

audioContext.audioWorklet.addModule('awl.js').then(() => {
    const processNode = new AudioWorkletNode(audioContext, 'processor');

    source.connect(processNode);
  processNode.port.onmessage = (event) => {
    nowvols=event.data;
        nowvol=0.0;
for(var i in nowvols){
 nowvoluf= parseFloat(nowvols[i]);
if(nowvoluf<0.0) nowvoluf=-nowvoluf;
if(nowvol<nowvoluf) nowvol=nowvoluf;
}
nowvol*=volgein;
  };
});
setInterval(repProcess,10);
}

render(peakmin);
start();

    </script>
</html>
