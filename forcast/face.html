<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />

        body{

</head>
<body>
    <div>
        <p id="uag"></p>
        <img id="flb" src="face_brow.svg" />
        <img id="fle" src="face_eye.svg" />
        <img id="frb" src="face_brow.svg" />
        <img id="fre" src="face_eye.svg" />
        <img id="mou" src="face_mouth.svg" />
    </div>
    
</body>
    <script>




        var idflb = document.getElementById("flb");
        var idfle = document.getElementById("fle");
        var idfrb = document.getElementById("frb");
        var idfre = document.getElementById("fre");
        var idmou = document.getElementById("mou");

var nowtime=Date.now();
var deltime=0;
var nowvol=0.0;
var nowpeak=0.0;
var peakup=100.0;
var peakdown=1000.0;

        
function posandsize(){
  idflb.style.left= "47px";
  idflb.style.top= "84.5px";
  idfle.style.left= "77px";
  idfle.style.top= "144.5px";
  idfrb.style.left= "177px";
  idfrb.style.top= "84.5px";
  idfre.style.left= "197px";
  idfre.style.top= "144.5px";

  idflb.style.width= "96px";
  idflb.style.height= "46px";
  idfle.style.width= "46px";
  idfle.style.height= "106px";
  idfrb.style.width= "96px";
  idfrb.style.height= "46px";
  idfre.style.width= "46px";
  idfre.style.height= "106px";
  
}

posandsize();
  idmou.style.left= "107px";
  idmou.style.top= "284.5px";
  idmou.style.width= "106px";
  idmou.style.height= "46px";







//const AudioContext = window.AudioContext || window.webkitAudioContext;
//const meter = document.getElementById('volume');

function render(micval) {
    var retio=0.4+micval;
  //console.log('Percent:', percent);
  idmou.style.left= "107px";
  idmou.style.top= "284.5px";
  idmou.style.width= "106px";
  idmou.style.height= 46*retio + "46px";

posandsize();

}

function repProcess() {
  deltime=Date.now()-nowtime;
  nowtime=Date.now();

  
if(nowpeak<nowvol) nowpeak+=deltime/peakup;
else nowpeak-=deltime/peakdown;


        var uag = document.getElementById("uag");
        uag.innerText=nowpeak;
  render(nowpeak);
}








async function start() {


const constraints = {audio: true};
const mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
const options = { sampleRate: 44100 };
const audioContext = new AudioContext(options);
const source = audioContext.createMediaStreamSource(mediaStream);

//const worklet = audioContext.audioWorklet;

audioContext.audioWorklet.addModule('awl.js').then(() => {
    const processNode = new AudioWorkletNode(audioContext, 'processor');

    source.connect(processNode);
  processNode.port.onmessage = (event) => {
    // Handling data from the processor.
    nowvols=event.data;

        nowvol=0.0;
for(var i in nowvols){
 nowvoluf= parseFloat(nowvols[i]);
if(nowvoluf<0.0) nowvoluf=-nowvoluf;
if(nowvol<nowvoluf) nowvol=nowvoluf;
}

  };
});
setInterval(repProcess,10);


}



start();



    </script>
