        var idflb = document.getElementById("flb");

const AudioContext = window.AudioContext || window.webkitAudioContext;
const meter = document.getElementById('volume');

function render(percent) {
    if(percent>100)percent=100;
    var retio=0.4+percent/100;
  //console.log('Percent:', percent);
  idmou.style.left= "107px";
  idmou.style.top= "284.5px";
  idmou.style.width= "106px";
  idmou.style.height= 46*retio + "46px";

posandsize();

}

function onProcess(event) {
  const data = event.inputBuffer.getChannelData(0);
  const peak = data.reduce((max, sample) => {
    const cur = Math.abs(sample);
    return max > cur ? max : cur;
  });
  render(100 / 32 * 10 * Math.log10(peak) + 100);
}

async function start() {
  const media = await navigator.mediaDevices
    .getUserMedia({ audio: true })
    .catch(console.error);
const options = { sampleRate: 44100 };
  const ctx = new AudioContext(options);
  //console.log('Sampling Rate:', ctx.sampleRate);
var userAgent = window.navigator.userAgent;
        var uag = document.getElementById("uag");
        uag.innerText=userAgent;

  const processor = ctx.createScriptProcessor(1024, 1, 1);
  processor.onaudioprocess = onProcess;
  processor.connect(ctx.destination);

  const source = ctx.createMediaStreamSource(media);
  source.connect(processor);
}



start();
